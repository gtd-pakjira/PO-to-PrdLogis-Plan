# location_mapping.yaml
# ตาราง map รหัสสถานที่ส่ง (Delivery Location Number จาก PO) -> กลุ่มพื้นที่ (Logistic Plan group)
#
# กลุ่มพื้นที่ (group) มี 3 ค่าที่เป็นไปได้ตอนนี้ (POC เน้น "group" สำหรับ Production Plan
# ยังไม่ต้องใช้ sub_location/delivery_time จนกว่าจะทำ Logistic Plan ใน Phase 1b):
#   - บางบัวทอง   (รวม รอบเช้าต่างจังหวัด เข้าไปด้วยตามที่ตกลงไว้ - ยังเป็นสมมติฐาน ปรับได้)
#   - มหาชัย
#   - สุวรรณภูมิ
#
# ที่มา: สกัดจาก cpall_po_export_20260825.xlsx (คอลัมน์ Delivery Location Number / Delivery Location)
# วันที่สกัด: 2026-08-26
# อัปเดต 2026-08-28: แยก "รอบเช้าต่างจังหวัด" ออกเป็นกลุ่มของตัวเอง (เดิมเคยเดาไว้ว่าน่าจะรวมกับ
# บางบัวทอง แต่เช็คกับไฟล์เทมเพลตจริง (บางบัวทอง.xlsx) แล้วพบว่าไม่มีคอลัมน์รองรับ 5 จุดนี้เลย —
# ยังไม่มี Logistic Plan template สำหรับกลุ่มนี้ เก็บพักไว้ก่อน รอ Template จริงจากทางบริษัท

