<div
    id="template-version-confirm-popup"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/30"
    x-data
    @toast.window="
        if (($event.detail.level || 'success') === 'success') {
            $el.remove();
        }
    "
>    
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 p-5">

        <h2 class="text-base font-semibold text-stone-900">
            ยืนยันการเปลี่ยน Template
        </h2>

        <p class="text-sm text-stone-600 mt-2">
            ProductMaster ตรงกับ Template แล้ว
        </p>

        <p class="text-sm text-stone-600 mt-1">
            ต้องการเปลี่ยนไปใช้
            <span class="font-medium text-stone-900">
                เวอร์ชัน {{ version.version_number }}
            </span>
            หรือไม่?
        </p>

        <div class="flex justify-end gap-2 mt-5">

            <button
                type="button"
                onclick="this.closest('.fixed').remove()"
                class="rounded-md border border-stone-300 px-3 py-1.5 text-sm text-stone-600 hover:bg-stone-50"
            >
                ยกเลิก
            </button>

            <form
                hx-post="{% url 'cpall:template_version_activate' key version_id %}"
                hx-target="#version-list-container"
                hx-swap="innerHTML"
            >
                {% csrf_token %}

                <button
                    type="submit"
                    class="rounded-md bg-emerald-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-800"
                >
                    ยืนยัน ใช้เวอร์ชันนี้
                </button>
            </form>

        </div>

    </div>
</div>
