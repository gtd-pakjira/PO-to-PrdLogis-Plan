{% load crispy_forms_tags %}
<div id="import-form-container" class="bg-white rounded-lg border border-stone-200 p-6 max-w-lg">
    <form hx-post="{% url 'cpall:import_submit' %}" hx-target="#import-form-container" hx-swap="outerHTML"
          hx-encoding="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}

        <p class="text-xs text-stone-400 mt-1 mb-5">
            เช่น รอบบ่าย (~13:30) วันที่ผลิตและวันที่ PO มักไม่ตรงกัน — รอบเช้าต่างจังหวัดมักเป็นวันเดียวกัน
        </p>

        <button type="submit"
                class="w-full rounded-md bg-emerald-700 px-4 py-2.5 text-sm font-medium text-white
                       hover:bg-emerald-800 transition disabled:opacity-70 inline-flex items-center justify-center gap-1.5"
                hx-disabled-elt="this">
            <svg class="htmx-indicator h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            นำเข้า PO
        </button>
    </form>
</div>
