<div id="resolve-products-form-container">
    {% if error %}
    <div class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 max-w-2xl">
        {{ error }}
    </div>
    {% endif %}

    <form hx-post="{% url 'cpall:resolve_products' po_import_id %}"
          hx-target="#resolve-products-form-container" hx-swap="outerHTML" class="max-w-2xl space-y-4">
        {% csrf_token %}

        {% for barcode, item_name in unknown_skus %}
        <div class="bg-white rounded-lg border border-stone-200 p-4">
            <p class="text-sm font-medium text-stone-900 mb-3">
                <span class="mono text-stone-400">{{ barcode }}</span> — {{ item_name }}
            </p>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">ชื่อสินค้า (ไทย)</label>
                    <input type="text" name="name_th_{{ barcode }}" placeholder="{{ item_name }}"
                           class="block w-full rounded-md border border-stone-300 px-2.5 py-1.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">ชื่อสินค้า (อังกฤษ)</label>
                    <input type="text" name="name_en_{{ barcode }}"
                           class="block w-full rounded-md border border-stone-300 px-2.5 py-1.5 text-sm">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 mt-3">
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">บรรจุ/ตะกร้า (ชิ้น)</label>
                    <input type="number" name="pack_size_{{ barcode }}" min="1"
                           class="block w-full rounded-md border border-stone-300 px-2.5 py-1.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">ราคา (ถ้ามี)</label>
                    <input type="number" step="0.01" name="unit_price_{{ barcode }}"
                           class="block w-full rounded-md border border-stone-300 px-2.5 py-1.5 text-sm">
                </div>
            </div>
        </div>
        {% endfor %}

        <div class="flex items-center gap-3">
            <button type="submit"
                    class="rounded-md bg-emerald-700 px-4 py-2.5 text-sm font-medium text-white hover:bg-emerald-800 transition disabled:opacity-70 inline-flex items-center gap-1.5"
                    hx-disabled-elt="this">
                <svg class="htmx-indicator h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
                บันทึก
            </button>
            <a href="{% url 'cpall:po_list' %}" class="text-sm text-stone-500 hover:text-stone-700 hover:underline">
                ข้ามไปก่อน กรอกทีหลัง
            </a>
        </div>
    </form>
</div>
