<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}แพลนผลิต 7-11{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <style>
        /* Alpine.js ไม่ได้เติม CSS นี้ให้อัตโนมัติ ต้องประกาศเอง — กัน element ที่มี x-cloak
           กระพริบโชว์ตอน page เพิ่งโหลด ก่อนที่ Alpine.js จะประมวลผล x-show เสร็จ */
        [x-cloak] { display: none !important; }
    </style>
    <script src="https://unpkg.com/alpinejs@3.14.8" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Thai', system-ui, sans-serif; background-color: #FAFAF9; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px;
            font-size: 13.5px; color: #57534e; transition: background-color .12s ease, color .12s ease;
        }
        .nav-item:hover { background-color: #F0EFEB; color: #292524; }
        .nav-item.active { background-color: #ECFDF5; color: #047857; font-weight: 500; }
        .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
        .card { background: #fff; border: 1px solid #E7E5E4; border-radius: 10px; }
        .card-row:hover { background-color: #FAFAF9; }
        table th { font-weight: 500; }
        ::selection { background-color: #A7F3D0; }
    </style>
</head>
<body
    class="min-h-screen text-stone-800 antialiased"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
>
    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <aside class="w-56 shrink-0 bg-white border-r border-stone-200 flex flex-col">
            <div class="px-4 py-4 border-b border-stone-100">
                <a href="/" class="flex items-center gap-2.5">
                    <span class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-md text-white font-bold text-[10px] tracking-tight"
                          style="background: linear-gradient(180deg, #F4811F 0%, #F4811F 20%, #FFFF 20%, #FFFF 25%, #008062 30%, #008062 65%, #FFFF 70%, #FFFF 75%, #ED2525 75%, #ED2525 100%);">7-11</span>
                    <span class="font-semibold text-stone-900 text-[13.5px] leading-tight">แพลนผลิต 7-11</span>
                </a>
            </div>

            <nav class="flex-1 px-2.5 py-3 space-y-0.5">
                <a href="{% url 'cpall:index' %}" class="nav-item {% block nav_dashboard %}{% endblock %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
                    หน้าหลัก
                </a>
                <a href="{% url 'cpall:po_list' %}" class="nav-item {% block nav_po %}{% endblock %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
                    PO
                </a>
                <a href="{% url 'cpall:plan_list' %}" class="nav-item {% block nav_plan %}{% endblock %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    แผน
                </a>
                <a href="{% url 'cpall:template_list' %}" class="nav-item {% block nav_template %}{% endblock %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
                    Template
                </a>
                <div class="pt-3 mt-3 border-t border-stone-100 space-y-0.5">
                    <a href="/admin/" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        Admin
                    </a>
                    <a href="/" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                        Portal
                    </a>
                </div>
            </nav>

            <div class="px-4 py-3 border-t border-stone-100 text-xs text-stone-400">
                แพลนผลิต 7-11
            </div>
        </aside>

        <!-- Main content -->
        <div class="flex-1 min-w-0">
            <main class="max-w-4xl mx-auto px-6 sm:px-10 py-9">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <div class=>
        
    </div>

    <!-- Loading overlay — คลุมกลางจอตอนกำลังส่งคำขอ HTMX ที่ใช้เวลานาน (เช่น สร้างแผน/คำนวณแผนใหม่
         ต้องรอ LibreOffice คำนวณสูตรจริง) — ดักฟัง HTMX's global event htmx:beforeRequest/afterRequest
         เอง (ไม่ผูกกับปุ่มใดปุ่มหนึ่งโดยเฉพาะ ใช้ได้กับทุกจุดในเว็บอัตโนมัติ) หน่วงเวลา 250ms ก่อนโชว์
         กัน request เร็วๆ (เช่น ค้นหาในตาราง) กระพริบจอโดยไม่จำเป็น และ "afterRequest" ยกเลิก timer
         เสมอไม่ว่า request จะสำเร็จ/ล้มเหลว กันเคส "ค้างตลอดไป" ที่เคยเจอกับ spinner แบบเดิม

         *** เพิ่มข้อความเตือนถ้ารอนานเกิน 3 วิ (2026-09-06) *** — วัดเวลาจริงพบว่า "แก้ไขยอดเผื่อ"
         (คำนวณ Production+Logistic Plan ใหม่ทั้งหมด) ใช้เวลาถึง ~10 วิ ข้อความเดิม "กำลังดำเนินการ"
         เฉยๆ ทำให้ผู้ใช้ไม่รู้ว่าต้องรอนานแค่ไหน อาจคิดว่าปุ่มไม่ทำงานแล้วกดซ้ำ/รีเฟรชหน้า (ดูเหมือน
         ระบบ "ค้าง"/"วนไปมา") — ใช้ generic mechanism นี้ (ไม่ผูกกับ endpoint ใดโดยเฉพาะ) ครอบคลุมทุก
         จุดที่อาจใช้เวลานานเหมือนกัน (เช่น สร้างแผนครั้งแรกก็ใช้เวลานานพอกัน) -->
    <div x-data="{
            visible: false,
            message: 'กำลังดำเนินการ กรุณารอสักครู่...',
            timer: null,
            slowTimer: null,
            onStart() {
                this.message = 'กำลังดำเนินการ กรุณารอสักครู่...'
                this.timer = setTimeout(() => { this.visible = true }, 250)
                this.slowTimer = setTimeout(() => {
                    this.message = 'ระบบกำลังคำนวณ อาจใช้เวลาถึง 10 วินาที กรุณารอสักครู่...'
                }, 3000)
            },
            onGroupSubmitStart() {
                this.message = 'ระบบกำลังดำเนินการ กรุณารอสักครู่...'

                this.timer = setTimeout(() => {
                    this.visible = true
                }, 250)

                this.slowTimer = setTimeout(() => {
                    this.message = 'ระบบกำลังดำเนินการ อาจใช้เวลาสักครู่ กรุณารอสักครู่...'
                }, 3000)
            },
            onEnd() { clearTimeout(this.timer); clearTimeout(this.slowTimer); this.visible = false }
         }"
         @htmx:before-request.window="onStart()"
         @htmx:after-request.window="onEnd()"
         @htmx:response-error.window="onEnd()"
         @htmx:send-error.window="onEnd()"
         @group-submit-loading.window="onGroupSubmitStart()"
         x-show="visible" x-cloak
         class="fixed inset-0 z-[100] bg-stone-900/30 flex items-center justify-center">
        <div class="bg-white rounded-lg px-6 py-5 shadow-xl flex items-center gap-3">
            <svg class="h-5 w-5 animate-spin text-emerald-700 shrink-0" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <span class="text-sm font-medium text-stone-700" x-text="message"></span>
        </div>
    </div>

    <!-- Toast notification (สำเร็จเท่านั้น) — ทำงานร่วมกับ HTMX: view ฝั่ง Django ส่ง response header
         "HX-Trigger" เป็น JSON เช่น {"toast": {"message": "บันทึกสำเร็จ", "level": "success"}} — Alpine
         ดักฟัง event "toast" ที่ HTMX ยิงออกมาอัตโนมัติ แล้วโชว์ทันที หายเองใน 4 วิ
         *** level "error" ไม่ผ่านทางนี้อีกต่อไป (ดู alert modal ด้านล่าง) ***
         เจอปัญหาจริง (2026-09-05): error message มักมีรายละเอียดสำคัญที่ต้องอ่าน (เช่น ชื่อ SKU ที่
         ถูกบล็อก) แต่ toast หายเร็วเกินไปจนอ่านไม่ทัน ผู้ใช้ไม่รู้ว่า action ล้มเหลวเพราะอะไร กด submit
         ซ้ำไปเรื่อยๆ (ดูเหมือนหน้าเว็บ "loop" ทั้งที่จริงๆ คือ error ซ้ำๆ ที่มองไม่เห็น) -->
    <div x-data="{ toasts: [] }"
         @toast.window="
            if (($event.detail.level || 'success') === 'error') return;
            const id = Date.now();
            toasts.push({
                id: id,
                message: $event.detail.message,
                level: $event.detail.level || 'success',
                detailUrl: $event.detail.detail_url || ''
            });
            setTimeout(() => toasts = toasts.filter(t => t.id !== id), 6000)
        "
         class="fixed bottom-5 right-5 z-50 space-y-2 w-96">
        <template x-for="t in toasts" :key="t.id">
            <div
                x-show="true"
                x-transition:enter="transition ease-out duration-200"
                x-transition:enter-start="opacity-0 translate-y-2"
                x-transition:enter-end="opacity-100 translate-y-0"
                x-transition:leave="transition ease-in duration-150"
                x-transition:leave-end="opacity-0"
                class="rounded-lg px-4 py-3 shadow-lg text-sm font-medium flex items-start gap-3"
                :class="t.level === 'warning'
                    ? 'bg-amber-50 border border-amber-300 text-amber-900'
                    : 'bg-stone-800 text-white'"
            >
                <span
                    x-show="t.level === 'warning'"
                    class="shrink-0 text-lg leading-none"
                    aria-hidden="true"
                >
                    ⚠️
                </span>

                <div class="flex-1 min-w-0">
                    <span x-text="t.message" class="block"></span>

                    <a
                        x-show="t.detailUrl"
                        :href="t.detailUrl"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="mt-1 inline-block text-xs font-semibold text-amber-800 hover:text-amber-950 underline"
                    >
                        ดูรายการที่ไม่พบใน Template ↗
                    </a>
                </div>

                <button
                    type="button"
                    @click="toasts = toasts.filter(item => item.id !== t.id)"
                    class="shrink-0 text-stone-500 hover:text-stone-900 text-lg leading-none"
                    aria-label="ปิด"
                    title="ปิด"
                >
                    &times;
                </button>
            </div>
        </template>
    </div>

    <!-- Alert modal (error เท่านั้น) — ต้องกดปิดเอง ไม่หายเองเด็ดขาด (แก้ปัญหา toast หายเร็วเกินไป
         ด้านบน) — ใช้ event "toast" เดียวกับด้านบน แต่กรองเอาเฉพาะ level "error" -->
    <div x-data="{ show: false, message: '', detailUrl: '' }"
        @toast.window="
            if (($event.detail.level || 'success') !== 'error') return;
            message = $event.detail.message;
            detailUrl = $event.detail.detail_url || '';
            show = true;
        "
         x-show="show" x-cloak
         class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 px-4"
         @keydown.escape.window="show = false">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-5" @click.outside="show = false">
            <div class="flex items-center gap-2 mb-3">
                <span class="inline-flex h-6 w-6 items-center justify-center rounded-full bg-red-100 text-red-700 text-sm">✕</span>
                <p class="text-sm font-semibold text-stone-900">ทำรายการไม่สำเร็จ</p>
            </div>
            <p class="text-sm text-stone-700 whitespace-pre-line" x-text="message"></p>

            <a
                x-show="detailUrl"
                :href="detailUrl"
                target="_blank"
                rel="noopener noreferrer"
                class="mt-4 block w-full rounded-md border border-stone-300 px-4 py-2 text-center text-sm font-medium text-stone-700 hover:bg-stone-50 transition"
            >
                ดูรายการที่ไม่พบใน Template ↗
            </a>

            <button @click="show = false"
                    class="mt-4 w-full rounded-md bg-stone-800 px-4 py-2 text-sm font-medium text-white hover:bg-stone-900 transition">
                ปิด
            </button>
        </div>
    </div>

    <script>
        // ใช้คู่กับ buffer_form_submit's HX-Trigger "replaceLocation" — ไปหน้าปลายทางโดย "แทนที่"
        // หน้าปัจจุบันใน browser history แทนที่จะ "เพิ่ม" entry ใหม่ (ต่างจาก HTMX's HX-Redirect ปกติ
        // ที่ทำ window.location = url) — กันปุ่มย้อนกลับพาไปหน้า "ขั้นตอนแวะผ่าน" (เช่น กรอกยอดเผื่อ)
        // ที่ผู้ใช้ไม่ได้มองว่าเป็นปลายทางที่ต้องย้อนกลับไปดูอีก
        document.body.addEventListener('replaceLocation', function (evt) {
            window.location.replace(evt.detail.url);
        });

        // ล้าง checkbox PO ทุกครั้งที่กลับมาหน้านี้ด้วย back/forward — กัน checkbox ค้างจากรอบก่อน
        // (pageshow ยิงทุกครั้งที่หน้าแสดง รวมถึงตอนดึงจาก bfcache ต่างจาก load ที่ยิงแค่ครั้งแรก)
        window.addEventListener('pageshow', function (event) {
            // event.persisted = true หมายถึงหน้านี้ถูกดึงมาจาก bfcache (ไม่ใช่โหลดใหม่จริง) — ใช้คู่กับ
            // "goBackAfterSave" event ด้านล่าง (หน้าแก้ไขยอดเผื่อ) ที่เรียก history.back() แทน
            // window.location.replace() — history.back() ทำให้ไม่มี URL ซ้อนกันใน history เลย (กด
            // "กลับ" ที่หน้าแผนแล้วไปตามที่มาจริงเสมอ ไม่ว่าจะมาจากหน้าแรกหรือหน้ารายการแผน) แต่มีความ
            // เสี่ยงว่า browser อาจโชว์หน้าเดิมจาก bfcache (ตัวเลขเก่าก่อนคำนวณใหม่) แทนที่จะดึงข้อมูลสด
            // — บังคับ reload จริงทุกครั้งที่ตรวจพบว่ามาจาก bfcache กันปัญหานี้ (2026-09-06)
            if (event.persisted) {
                window.location.reload();
                return;
            }
            document.querySelectorAll('input[name="po_import_ids"]').forEach(function (cb) {
                cb.checked = false;
            });
        });

        // ใช้คู่กับหน้าแก้ไขยอดเผื่อ — หลังบันทึกสำเร็จ เรียก history.back() แทน location.replace()
        // เพื่อไม่ให้มี URL หน้าแผนซ้อนกัน 2 ชั้นใน history (ปัญหาเดิม: กด "กลับ" ที่หน้าแผนครั้งแรก
        // ดูเหมือนไม่ขยับเพราะมีหน้าแผน URL เดียวกันซ้อนอยู่ ต้องกด 2 ครั้งถึงจะไปหน้าที่มาจริง)
        document.body.addEventListener('goBackAfterSave', function () {
            history.back();
        });
    </script>
</body>
</html>
